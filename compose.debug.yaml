services:
  rui:
    image: rui
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 email_env/lib/python3.13/site-packages/mysql/ai/genai/vector_store.py "]
    ports:
      - 5678:5678
